[package]
name = "jade"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Jade — memory-aware C++/Metal IDE with live GPU training visualization"

[dependencies]
# Zed's GPU-accelerated UI framework, used as a library — Jade borrows the
# engine, not the editor shell. Pinned by rev: the video card builds on
# `surface()`/`SurfaceSource`, which carries no stability guarantee on `main`
# (§4.15 risk 6). Bump deliberately, with the video card re-tested.
gpui = { git = "https://github.com/zed-industries/zed", rev = "56ab1c48257094573707ab1548bdd3b8dec6d8d8" }
# font-kit is off by default and without it gpui_macos has no font provider —
# no text renders at all (bites every standalone GPUI consumer).
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "56ab1c48257094573707ab1548bdd3b8dec6d8d8", features = ["font-kit"] }
jade-telemetry = { path = "../jade-telemetry" }
jade-build = { path = "../jade-build" }
jade-debug = { path = "../jade-debug" }
# Editor text core (E2): rope-backed Buffer, cursors, grouped undo/redo,
# LSP-shaped incremental EditRecords, dirty tracking. Backs each OpenTab.
jade-buffer = { path = "../jade-buffer" }
# clangd LSP client (E2): diagnostics/completion/hover/definition over stdio.
jade-lsp = { path = "../jade-lsp" }
# The LSP domain vocabulary jade-lsp is built on. jade needs a few types
# jade-lsp doesn't re-export (CompletionTextEdit/TextEdit for applying
# completions); pinned to the exact version jade-lsp uses so the types unify.
lsp-types = "0.97"
jade-sysmon = { path = "../jade-sysmon" }
jade-ai = { path = "../jade-ai" }
# Headless terminal engine (PTY + alacritty grid state machine); Jade renders
# its GridSnapshots in the bottom TERMINAL strip (Phase-4 wave 2, §5.2).
jade-term = { path = "../jade-term" }
# Cross-platform filesystem watcher for the file-tree auto-refresh (§5.1); the
# recommended backend (FSEvents on macOS) is debounced 250ms in app wiring.
notify = "8"
# `signal` is additive to the workspace features: ⌃C / SIGTERM must kill the
# managed llama-server before we exit (see `spawn_signal_cleanup`).
tokio = { workspace = true, features = ["signal"] }
serde = { workspace = true }
serde_json = { workspace = true }
# Read-only syntax highlighting (editor-core Step 1): the plain tree-sitter
# runtime + the C++ grammar (also drives .metal via added Metal keywords). No
# zed language/editor crates — a focused highlight query maps captures to the
# jade-dark palette (§4.2).
tree-sitter = "0.25"
tree-sitter-cpp = "0.23"
# Verilog grammar for hardware mode (§B9): plain-Verilog highlighting in the
# same query architecture as the C++ one. Preferred over the huge
# tree-sitter-systemverilog grammar. Verify duplicates with `cargo tree -d`.
tree-sitter-verilog = "1.0.3"
# Hardware mode (FPGA board simulation): Verilator compile + persistent sim
# child + the DK-DEV-10M50-A board model.
jade-hw = { path = "../jade-hw" }
# Regex-driven static analysis for the editor decoration ports (§4.5 memory
# size annotations, §4.8 execution flow). Mirrors the TS regex/brace-count
# approach (no AST); already present transitively in the lockfile.
regex = "1"
# Error context for the bundled-icon AssetSource (assets.rs); gpui's AssetSource
# trait speaks anyhow::Result, so we surface a missing asset with .context().
anyhow = "1"
# Concurrent language-server hovers when building an Explain prompt: the
# lookups are independent, so they are joined rather than awaited in turn.
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
# Tensor heatmap previews are baked into a gpui RenderImage once per NEW frame
# and drawn as one textured quad (the TS putImageData→drawImage architecture) —
# painting one quad per cell per repaint was the training-view lag. Versions
# must unify with gpui's own `image`/`smallvec` (RenderImage::new takes both).
image = { version = "0.25", default-features = false }
smallvec = "1"
# Persistent run store (run_store.rs): every telemetry run's scalar/timing/
# memory series + metadata land in <workspace>/.jade/runs.db so the training
# view can overlay & compare historical runs. `bundled` compiles SQLite in —
# no system-lib version drift, same choice Zed makes for its sqlez.
rusqlite = { version = "0.40.1", features = ["bundled"] }
# Instruments templates are NSKeyedArchiver binary plists; the CPU Counters
# event list inside them is base64 plists inside JSON. `plist` reads and
# writes both layers, `base64` the inner encoding. `libloading` opens the
# private kperfdata framework for the event catalog.
plist = "1"
base64 = { workspace = true }
libloading = "0.8"
# Setting the app-scoped AppleFontSmoothing=0 default at startup (crisp/thin
# text, same trick as Chromium's -webkit-font-smoothing: antialiased); gpui's
# mac text system reads it to skip glyph dilation. Version matches gpui's.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
# The 3D weight grid's real GPU renderer (wg3d/metal.rs): instanced bars drawn
# with Metal into a CVPixelBuffer that gpui's `surface()` element presents
# zero-copy. Versions pinned to the ones gpui itself locks so types unify
# (core-video's CVMetalTextureCache takes a metal::Device).
metal = "0.33"
core-video = { version = "0.5.2", features = ["metal"] }
# Visualize playback (video/): AVPlayer + AVPlayerItemVideoOutput decoding the
# rendered mp4 straight into 420f CVPixelBuffers for gpui's `surface()`.
# `default-features = false` matters: objc2-av-foundation has 172 features and
# a naive `all` adds minutes to a clean build. The objc2 generation (0.6.x via
# gpui) unifies — verify with `cargo tree -d` that no new duplicates appear.
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = [
  "AVAsset", "AVPlayer", "AVPlayerItem", "AVPlayerItemOutput",
  "objc2-core-media", "objc2-core-video" ] }
objc2-core-media = { version = "0.3", default-features = false, features = ["CMBase", "CMTime"] }
objc2-core-video = { version = "0.3", default-features = false, features = [
  "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer" ] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFBase", "CFString", "CFDictionary", "CFNumber"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSURL", "NSString", "NSDictionary", "NSValue", "NSObject", "NSEnumerator"] }

# Playback tests run on the real main thread and pump the run loop
# themselves — AVPlayer never leaves `Unknown` on a libtest worker thread.
[[test]]
name = "video_playback"
harness = false

[dev-dependencies]
# test-support turns on gpui's TestAppContext/VisualTestContext so interaction
# tests can drive real clicks/keystrokes through the full window dispatch path
# (hitboxes, focus, IME) headlessly — the same harness Zed's own tests use.
gpui = { git = "https://github.com/zed-industries/zed", rev = "56ab1c48257094573707ab1548bdd3b8dec6d8d8", features = ["test-support"] }
