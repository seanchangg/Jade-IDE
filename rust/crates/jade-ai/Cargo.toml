[package]
name = "jade-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Jade AI inline-completion backend: llama.cpp llama-server manager + /infill client (port of src/main/inline-completion.ts)"

[dependencies]
# `process` is additive to the workspace tokio feature set (rt-multi-thread,
# net, io-util, sync, time, macros) — needed to spawn/monitor llama-server.
tokio = { workspace = true, features = ["process"] }
serde = { workspace = true }
serde_json = { workspace = true }
# `kill(2)`: the quit path takes the managed server down by PID, because a tokio
# `Child` (and so `kill_on_drop`) is unusable from a quit or signal handler.
libc = "0.2"
# rustls keeps us off OpenSSL; all managed traffic is plain HTTP to 127.0.0.1,
# but JADE_FIM_ENDPOINT may point at any (possibly https) host — see TS :52.
# `stream` gives `Response::bytes_stream()`, which the chat layer needs to
# read SSE incrementally — without it a streaming response can only be awaited
# whole, which defeats the point.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# `StreamExt::next` over that byte stream. Default features pull in an executor
# and the `async-await` proc macros we do not use.
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
