[workspace]
resolver = "2"
members = [
    "crates/jade-telemetry",
    "crates/jade-buffer",
    "crates/jade-build",
    "crates/jade-hw",
    "crates/jade-debug",
    "crates/jade-lsp",
    "crates/jade-ai",
    "crates/jade-sysmon",
    "crates/jade-term",
    "crates/jade",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# Dev builds (`cargo dev`) keep the workspace crates unoptimized for ~1s
# incremental rebuilds, but compile all DEPENDENCIES with optimizations —
# tree-sitter parsing, ropey, and GPUI's text shaping/render path run 10-30×
# slower at opt-level 0, which made every editor keystroke cost ~73ms on a
# 1.1k-line file (full-file rehighlight, measured). Deps rarely change, so
# the optimized artifacts cache after one build.
[profile.dev.package."*"]
opt-level = 2
